[project]
name = "raglab1"
version = "0.1.0"
description = "Multi-channel RAG chatbot (Core Rules PDF + SQLite unit database) for Warhammer 40,000"
readme = "README.md"
authors = [
    { name = "Lezhi ZHANG", email = "joycezhang815@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.128.0",
    "google-genai>=2.33.0",
    "langgraph>=1.2.18",
    "pydantic-settings>=2.15.0",
    "rich>=13.7,<15",
    "sentence-transformers>=6.2.0",
    "sqlite-vec>=0.1.9",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
eval = [
    "langchain-community<0.4",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.6",
]
